name: Build and Pack D365ContextExporter

on:
  push:
    branches: [main]
    paths:
      - 'tooling/D365ContextExporter/**'
  pull_request:
    branches: [main]
    paths:
      - 'tooling/D365ContextExporter/**'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      nupkg-name: ${{ steps.pack.outputs.nupkg-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: dotnet restore tooling/D365ContextExporter/D365ContextExporter.sln

      - name: Build
        run: >
          dotnet build tooling/D365ContextExporter/D365ContextExporter.sln
          --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tooling/D365ContextExporter/D365ContextExporter.Tests/D365ContextExporter.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Pack
        id: pack
        shell: pwsh
        run: |
          nuget pack tooling/D365ContextExporter/D365ContextExporter/D365ContextExporter.nuspec `
            -BasePath tooling/D365ContextExporter/D365ContextExporter `
            -OutputDirectory nupkg
          $name = (Get-ChildItem nupkg/*.nupkg | Select-Object -First 1).Name
          echo "nupkg-name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D365ContextExporter-nupkg
          path: nupkg/*.nupkg

  publish:
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: D365ContextExporter-nupkg
          path: nupkg

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived nuget.org API key,
      # matched against the nuget.org policy for this repository and workflow file.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # -SkipDuplicate: a merge that does not bump the version leaves the published package as is.
      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $pkg = (Get-ChildItem nupkg/*.nupkg | Select-Object -First 1).FullName
          nuget push $pkg `
            -ApiKey $env:NUGET_API_KEY `
            -Source https://api.nuget.org/v3/index.json `
            -SkipDuplicate `
            -NonInteractive
